<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DB Modeling</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #app { width: 100%; height: 100%; overflow: hidden; background: #0a0b0c; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module">
    import init, * as wasm from './src/wasm/dbml_wasm.js';
    import { APP_ROOT_ID, mountWorkbench, WebSocketTransport } from './src/index.ts';

    await init();
    const api = {
      ...wasm,
      reinit: async () => {
        await init();
        return api;
      },
    };
    mountWorkbench(document.getElementById(APP_ROOT_ID), new WebSocketTransport(), api);
  </script>
</body>
</html>
