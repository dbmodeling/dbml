[workspace]
resolver = "2"
members = [
    "crates/core/*",
    "crates/atomic-write",
    "crates/app",
    "crates/cli",
    "crates/dbml-wasm",
    "crates/db-introspect",
    "crates/diagram-export",
    "crates/sql-import",
]
exclude = ["fuzz"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
version = "0.3.3"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[workspace.dependencies]
# Internal workspace crates
schema = { path = "crates/core/schema" }
dbml-syntax = { path = "crates/core/dbml-syntax" }
dbml-analysis = { path = "crates/core/dbml-analysis" }
dbml-edit = { path = "crates/core/dbml-edit" }
layout = { path = "crates/core/layout" }
atomic-write = { path = "crates/atomic-write" }
diagram-export = { path = "crates/diagram-export" }
sql-import = { path = "crates/sql-import" }
db-introspect = { path = "crates/db-introspect" }

# Parsing & CST
logos = "=0.16.1"
rowan = "=0.18.0-alpha.2"

# Serialization & Error Handling
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "=1.0.104"
thiserror = "=2.0.21"
tracing = "=0.1.44"

# Desktop UI & Platform (crates/app)
gpui-kit = "=0.8.0"
lsp-types = "=0.97.0"
embed-resource = "=3.0.12"

# CLI & Web Server (crates/cli & crates/app)
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
notify = "8"
rust-embed = "=8.13.0"
mime_guess = "2.0"
colored = "3.0"
opener = "0.7"

# WebAssembly (crates/dbml-wasm)
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"

# Dev / Testing
insta = "=1.49.0"
proptest = "=1.12.0"

# Optimized development build: GPUI without optimization is 10-50x slower to render.
# Keeps debug_assertions enabled (Windows cross-build relies on them to compile
# shaders at runtime) and uses line-tables-only debug info for faster incremental links.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

# Production release profile with Thin LTO, single codegen unit, symbol stripping, and panic=abort.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

# Speed-optimized release profile for WebAssembly (#117): measured +167 bytes vs opt-level="s"
# while running 500-table scene/routing ~2.5-2.7x faster (see docs/11-benchmarks-wasm.md).
[profile.release.package.dbml-wasm]
opt-level = 3

# Distribution profile with Fat LTO for maximum whole-program optimization.
[profile.dist]
inherits = "release"
lto = "fat"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
# Intentional across workspace (numeric casts are scoped per-crate in app/layout/diagram-export/dbml-wasm):
module_name_repetitions = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
many_single_char_names = "allow"
unreadable_literal = "allow"
wildcard_imports = "allow"
