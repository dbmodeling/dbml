# Política de dependências verificada por `cargo deny check` (workflow security.yml).
# Documentação: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# Vulnerabilidades e crates sem manutenção vêm do RustSec (mesma base do `cargo audit`).
yanked = "deny"

[licenses]
# Crates do workspace (publish = false, PolyForm Noncommercial, não-OSI) não entram na checagem.
private = { ignore = true }
# Só licenças permissivas (ou copyleft de arquivo, como MPL-2.0). Expressões `OR` são
# satisfeitas por qualquer alternativa permitida; `AND` exige todas.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "0BSD",
    "MPL-2.0",
    "BSL-1.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
    "IJG",
    "NCSA",
]
confidence-threshold = 0.9

[bans]
# Versões duplicadas aparecem como aviso (o grafo do GPUI traz várias); não quebram o CI.
multiple-versions = "warn"
# As dependências entre crates do workspace são por caminho, sem versão.
wildcards = "allow"

[sources]
# Só o índice oficial do crates.io; nada de git ou registros alternativos.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
