version: 2

# Once a week (Monday 06:00, America/Manaus), one grouped PR per ecosystem, always against
# develop (flow in CONTRIBUTING.md). No auto-rebase: every rebase re-triggers the whole CI;
# comment `@dependabot rebase` to refresh a PR.
# Workflow actions are pinned by SHA and Dependabot keeps the version comment when proposing
# new SHAs.
# Security updates do not follow this file: they always target the default branch (main) and are
# never grouped with version updates (GitHub docs); ci.yml accepts `dependabot/*` -> main.
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Manaus
    rebase-strategy: disabled
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Manaus
    rebase-strategy: disabled
    commit-message:
      prefix: "chore(deps)"
    groups:
      rust:
        applies-to: version-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /packages/canvas-web
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Manaus
    rebase-strategy: disabled
    commit-message:
      prefix: "chore(deps)"
    groups:
      canvas-web:
        applies-to: version-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /vscode-extension
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Manaus
    rebase-strategy: disabled
    commit-message:
      prefix: "chore(deps)"
    groups:
      vscode-extension:
        applies-to: version-updates
        patterns: ["*"]
