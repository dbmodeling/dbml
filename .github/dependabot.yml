version: 2

# Atualizações semanais; as ações de workflow são fixadas por SHA e o Dependabot mantém o
# comentário de versão ao propor novos SHAs.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    groups:
      rust-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /packages/canvas-web
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      canvas-web:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /vscode-extension
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      vscode-extension:
        update-types: [minor, patch]
