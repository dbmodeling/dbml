name: CI

# CI policy (details in CONTRIBUTING.md):
#
# - Each commit runs the full suite once before other work builds on it; the gate is the PR.
#   * PR -> develop .................. full suite, filtered by changed paths.
#   * push to develop (merge) ........ full suite, unfiltered, and SAVES the cache.
#   * PR develop -> main ............. no re-run: the `gate` job requires the push run of the
#                                      same SHA on develop to have passed.
#   * PR release/* | hotfix/* | dependabot/* -> main ... full suite.
# - Cache: only pushes to develop save it. A cache created by a PR is scoped to the PR merge ref
#   and cannot be restored by any other run (GitHub docs); it only fills the 10 GB repository
#   quota and evicts the useful caches, making Windows/macOS build from scratch (~19 min instead
#   of ~3 min).
# - The only required check is `CI ok`: it aggregates every job, and a job skipped on purpose
#   (path filter, draft, gate) counts as ok.

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop, main ]
    types: [ opened, synchronize, reopened, ready_for_review ]

# Read-only by default; no CI job needs to write to the repository.
permissions:
  contents: read

# New commits on a PR cancel that PR's previous run. Pushes to develop are never cancelled:
# they save the cache and are what the `gate` job checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Keep in sync with `channel` in rust-toolchain.toml.
  RUST_TOOLCHAIN: "1.99.1"

# Every third-party action is pinned by commit SHA (comment = version);
# scripts/check-workflow-pins.sh rejects mutable tags/branches.
jobs:
  # ------------------------------------------------------------------ light jobs
  branch-name:
    name: Branch name
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate source branch name
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          case "$BASE_REF" in
            develop)
              pattern='^((feat|bug|improve|chore|ci)/[a-z0-9][a-z0-9._-]*|dependabot/.+|main)$'
              examples='feat/pdf-export, bug/parser-crlf, improve/zoom, chore/deps, ci/cache' ;;
            main)
              pattern='^(develop|release/v?[0-9]+\.[0-9]+(\.[0-9]+)?(-[a-z0-9.]+)?|hotfix/[a-z0-9][a-z0-9._-]*|dependabot/.+)$'
              examples='develop, release/v0.3.0, hotfix/crash-on-open' ;;
            *)
              echo "::error::Unexpected base branch: $BASE_REF"; exit 1 ;;
          esac
          if [[ "$HEAD_REF" =~ $pattern ]]; then
            echo "ok: '$HEAD_REF' -> '$BASE_REF'"
          else
            echo "::error::Branch '$HEAD_REF' is not accepted in a PR into '$BASE_REF'. Pattern: $pattern (e.g. $examples)"
            exit 1
          fi

  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
      web: ${{ steps.diff.outputs.web }}
      scripts: ${{ steps.diff.outputs.scripts }}
    steps:
      - name: Checkout (full history for the diff)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Decide which groups run
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set_all() { for g in rust web scripts; do echo "$g=$1" >> "$GITHUB_OUTPUT"; done; }
          if [ "$EVENT" = "push" ]; then
            echo "push to develop: run everything, unfiltered"; set_all true; exit 0
          fi
          if [ "$DRAFT" = "true" ]; then
            echo "draft PR: light jobs only"; set_all false; exit 0
          fi
          if [ "$BASE_REF" = "main" ] && [ "$HEAD_REF" = "develop" ]; then
            echo "develop -> main: covered by the gate job"; set_all false; exit 0
          fi
          files="$(git diff --name-only "$BASE_SHA"...HEAD)"
          echo "$files"
          has() { grep -Eq "$1" <<< "$files" && echo true || echo false; }
          rust="$(has '^(crates/|\.cargo/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|\.github/workflows/ci\.yml$)')"
          web="$(has '^(packages/|vscode-extension/|scripts/(build|check)-web-assets\.sh$)')"
          [ "$rust" = "true" ] && web=true
          scripts="$(has '^(scripts/|\.github/)|(^|/)package(-lock)?\.json$')"
          { echo "rust=$rust"; echo "web=$web"; echo "scripts=$scripts"; } | tee -a "$GITHUB_OUTPUT"

  fmt:
    name: Formatting (cargo fmt)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  # ------------------------------------------------------------------ heavy jobs
  # Full suite on all 3 OSes: "pure" crates also break per OS (CRLF on the Windows checkout,
  # path separators, case-insensitive macOS filesystem). With a warm cache Windows/macOS take ~3 min.
  quality:
    name: Rust (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install native dependencies (GPUI / Wayland / Vulkan / X11 / Fontconfig)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libfontconfig1-dev \
            libfreetype6-dev \
            libasound2-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libvulkan-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-xkb-dev \
            libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - name: Rust build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: "workspace-ci-${{ matrix.os }}"
          save-if: ${{ github.ref == 'refs/heads/develop' }}

      - name: Lint (cargo clippy)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test suite (cargo test)
        run: cargo test --locked --workspace

  # Same rustc and target as Ubuntu, so clippy would be identical. Tests stay because Fedora's
  # glibc, fontconfig and freetype differ (they affect raster export).
  fedora:
    name: Rust (Fedora)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    container:
      image: fedora:latest

    steps:
      - name: Install native dependencies (Fedora / GPUI / Wayland / Vulkan / X11 / Fontconfig)
        run: |
          dnf install -y \
            git \
            curl \
            tar \
            gcc \
            gcc-c++ \
            pkg-config \
            fontconfig-devel \
            freetype-devel \
            alsa-lib-devel \
            libxkbcommon-devel \
            libxkbcommon-x11-devel \
            vulkan-loader-devel \
            wayland-devel \
            libX11-devel \
            libxcb-devel \
            openssl-devel

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Rust build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: "workspace-ci-fedora"
          save-if: ${{ github.ref == 'refs/heads/develop' }}

      - name: Test suite (cargo test)
        run: cargo test --locked --workspace

  # Also covers dbml-wasm: build-web-assets.sh builds the Wasm (release) and the wasm32 clippy
  # runs here.
  web:
    name: Web (canvas-web, CLI bundle and VS Code extension)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain (wasm32 target)
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Rust build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: "web-ci"
          save-if: ${{ github.ref == 'refs/heads/develop' }}

      - name: Clippy for wasm32
        run: cargo clippy --locked -p dbml-wasm --target wasm32-unknown-unknown -- -D warnings

      - name: Read the wasm-bindgen version locked in Cargo.lock
        id: bindgen
        run: |
          version="$(awk '/^name = "wasm-bindgen"$/ {getline; gsub(/[version = "]/, ""); print; exit}' Cargo.lock)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Install wasm-bindgen-cli
        uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2
        with:
          tool: wasm-bindgen@${{ steps.bindgen.outputs.version }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            packages/canvas-web/package-lock.json
            vscode-extension/package-lock.json

      - name: Install canvas-web dependencies
        run: npm ci
        working-directory: packages/canvas-web

      - name: canvas-web tests (vitest)
        run: npm test
        working-directory: packages/canvas-web

      - name: Rebuild web assets (Wasm + canvas-web -> crates/cli/web)
        run: ./scripts/build-web-assets.sh

      # The bundle in crates/cli/web is committed and embedded in the CLI: if it differs from what
      # the current code generates, someone forgot ./scripts/sync-build.sh and the shipped UI is stale.
      - name: Check the committed bundle is up to date
        run: |
          if [ -n "$(git status --porcelain -- crates/cli/web)" ]; then
            echo "::error::crates/cli/web is out of date. Run ./scripts/sync-build.sh and commit."
            git status --short -- crates/cli/web
            exit 1
          fi

      - name: Upload the CI-built bundle (divergence diagnostics)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-bundle-ci
          path: crates/cli/web
          retention-days: 7

      - name: Install VS Code extension dependencies
        run: npm ci
        working-directory: vscode-extension

      - name: Type-check and bundle the extension
        run: |
          rm -rf dist
          npm run compile
          npm run build
        working-directory: vscode-extension

      - name: Check for unreferenced build outputs
        run: ./scripts/check-web-assets.sh

  scripts:
    name: Scripts and workflows
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Workflow actions pinned by SHA
        run: |
          ./scripts/check-workflow-pins.sh --self-test
          ./scripts/check-workflow-pins.sh

      - name: Frontend dependencies with exact versions
        run: |
          ./scripts/check-npm-pins.sh --self-test
          ./scripts/check-npm-pins.sh

      - name: Build and install script tests
        run: |
          ./scripts/check-web-assets.sh --self-test
          ./scripts/tests/install_test.sh

  # ------------------------------------------------------------------ gate and aggregator
  # PR develop -> main: the PR head is the same SHA already tested by the push to develop.
  # Instead of re-testing (cold cache, ~19 min), confirm that run passed. Never passes by omission.
  gate:
    name: Gate (develop → main)
    if: github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
    steps:
      - name: Require a green push run for the same develop SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          api="repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${SHA}&event=push&branch=develop&per_page=1"
          for attempt in $(seq 1 60); do
            read -r status conclusion url < <(gh api "$api" \
              --jq '.workflow_runs[0] // {} | "\(.status // "none") \(.conclusion // "none") \(.html_url // "-")"')
            echo "attempt ${attempt}: status=${status} conclusion=${conclusion} ${url}"
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "ok: ${SHA} passed on the develop push run"; exit 0
              fi
              echo "::error::The develop push run for ${SHA} finished with '${conclusion}': ${url}"
              exit 1
            fi
            if [ "$status" = "none" ] && [ "$attempt" -ge 4 ]; then
              echo "::error::No CI push run on develop for ${SHA}. Re-run CI on develop, then update the PR."
              exit 1
            fi
            sleep 30
          done
          echo "::error::Timed out waiting for the develop push run for ${SHA}."
          exit 1

  ci-ok:
    name: CI ok
    if: always()
    needs: [branch-name, changes, fmt, quality, fedora, web, scripts, gate]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: ${RESULTS}"
          for r in ${RESULTS}; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::A job finished with '${r}'."; exit 1 ;;
            esac
          done
