name: Segurança

on:
  push:
    branches: [ main, master ]
    paths:
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'deny.toml'
      - 'crates/**/Cargo.toml'
      - 'packages/*/package*.json'
      - 'vscode-extension/package*.json'
      - '.github/workflows/security.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'deny.toml'
      - 'crates/**/Cargo.toml'
      - 'packages/*/package*.json'
      - 'vscode-extension/package*.json'
      - '.github/workflows/security.yml'
  schedule:
    # Executa toda segunda-feira às 06:00 UTC para detectar novas CVEs publicadas
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Auditoria de Vulnerabilidades (RustSec)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar cargo-audit
        uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2
        with:
          tool: cargo-audit

      - name: Checagem com cargo-audit
        run: cargo audit

  deny:
    name: Licenças, fontes e versões duplicadas (cargo-deny)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar cargo-deny
        uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2
        with:
          tool: cargo-deny

      - name: Checagem com cargo-deny
        run: cargo deny --locked check

  npm-audit:
    name: Auditoria npm (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [packages/canvas-web, vscode-extension]

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: npm audit (severidade alta ou crítica)
        run: npm audit --audit-level=high
        working-directory: ${{ matrix.project }}
