name: Segurança

on:
  push:
    branches: [ main, master ]
    paths:
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'crates/**/Cargo.toml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'crates/**/Cargo.toml'
  schedule:
    # Executa toda segunda-feira às 06:00 UTC para detectar novas CVEs publicadas
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Auditoria de Vulnerabilidades (RustSec)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v6

      - name: Instalar cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Checagem com cargo-audit
        run: cargo audit
