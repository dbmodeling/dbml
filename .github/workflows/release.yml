name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag de versão manual (ex: v0.1.0)'
        required: false
        default: 'v0.1.0'

# Somente leitura por padrão; só o job `publish` recebe `contents: write`.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Manter igual a `channel` em rust-toolchain.toml.
  RUST_TOOLCHAIN: "1.99.1"
  # Versão exata do rsign2 (minisign) que assina o manifesto de auto-update (job `publish`).
  RSIGN2_VERSION: "0.6.7"

# Assinatura (veja SECURITY.md):
#   Repository variable  SIGNING_REQUIRED=true  => o build FALHA se os segredos de assinatura
#                                                  faltarem (use nas releases oficiais).
#   Sem a variável, artefatos sem assinatura saem com um aviso explícito no log.
# Todas as ações de terceiros são fixadas por SHA de commit (comentário = versão);
# scripts/check-workflow-pins.sh rejeita tags/branches mutáveis.
jobs:
  # ============================================================
  # 0. ATIVOS WEB (Wasm + canvas-web) RECONSTRUÍDOS A PARTIR DA TAG
  #    A CLI embute crates/cli/web; não confiamos no bundle commitado.
  # ============================================================
  web-bundle:
    name: Ativos web (Wasm + canvas-web)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Instalar Toolchain Rust (alvo wasm32)
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown

      - name: Cache de compilação
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: "release-web"
          # A cache saved on a tag ref only serves that tag: restore only (see ci.yml).
          save-if: false

      - name: Descobrir a versão do wasm-bindgen travada no Cargo.lock
        id: bindgen
        run: |
          version="$(awk '/^name = "wasm-bindgen"$/ {getline; gsub(/[version = "]/, ""); print; exit}' Cargo.lock)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Instalar wasm-bindgen-cli
        uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2
        with:
          tool: wasm-bindgen@${{ steps.bindgen.outputs.version }}

      - name: Instalar binaryen (wasm-opt)
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen

      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/canvas-web/package-lock.json

      - name: Testes do canvas-web
        run: |
          npm ci
          npm test
        working-directory: packages/canvas-web

      - name: Reconstruir os ativos web (com wasm-opt)
        run: ./scripts/build-web-assets.sh --opt

      - name: Verificar saídas de build sem referência
        run: ./scripts/check-web-assets.sh

      - name: Upload do bundle web
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-bundle
          path: crates/cli/web
          retention-days: 1
          if-no-files-found: error

  # ============================================================
  # 1. BUILD LINUX (Ubuntu / Debian .deb & Fedora .rpm)
  # ============================================================
  build-linux:
    name: Build Linux (.deb e .rpm)
    needs: web-bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Usar o bundle web reconstruído a partir da tag
        shell: bash
        run: find crates/cli/web -mindepth 1 -delete

      - name: Baixar o bundle web
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-bundle
          path: crates/cli/web

      - name: Instalar dependências nativas e de empacotamento
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libfontconfig1-dev \
            libfreetype6-dev \
            libasound2-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libvulkan-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-xkb-dev \
            libssl-dev \
            rpm

      - name: Instalar Toolchain Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache de compilação
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: "release-linux"
          save-if: false

      - name: Gerar pacote Debian / Ubuntu (.deb)
        run: ./scripts/build-deb.sh

      - name: Gerar pacote Fedora / RHEL (.rpm)
        run: ./scripts/build-fedora.sh

      # Tarball de usuário (instalado em ~/.local pelo install.sh e pelo auto-update). Já sai com o
      # nome canônico em dist/ e entra no SHA256SUMS.txt do job `publish`.
      - name: Gerar tarball de usuário (db-modeling-linux-x86_64.tar.gz)
        run: ./scripts/build-linux-tarball.sh

      - name: Criar aliases com nomes canônicos e anexar script universal
        run: |
          cd dist
          # Cria links canônicos para download direto sem versão no nome
          cp $(ls db-modeling_*_amd64.deb | head -n 1) db-modeling-linux-amd64.deb
          cp $(ls db-modeling-*-1.*.rpm | head -n 1) db-modeling-linux-x86_64.rpm
          # Anexa o assistente de instalação universal para terminal (curl | bash)
          cp ../scripts/install.sh db-modeling-install.sh

      - name: Upload dos artefatos Linux
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: artifacts-linux
          path: dist/*
          retention-days: 1

  # ============================================================
  # 2. BUILD WINDOWS (.exe) + assinatura SignPath
  # ============================================================
  build-windows:
    name: Build Windows (.exe)
    needs: web-bundle
    runs-on: windows-latest
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
      SIGNING_REQUIRED: ${{ vars.SIGNING_REQUIRED }}

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Usar o bundle web reconstruído a partir da tag
        shell: bash
        run: find crates/cli/web -mindepth 1 -delete

      - name: Baixar o bundle web
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-bundle
          path: crates/cli/web

      - name: Instalar Toolchain Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-pc-windows-msvc

      - name: Cache de compilação
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: "release-windows"
          save-if: false

      - name: Compilar executáveis release (App Desktop + CLI Web Server + helper de atualização)
        run: cargo build --locked --release -p app -p dbml-cli -p auto-update-helper

      - name: Verificar configuração de assinatura
        shell: bash
        run: |
          if [ -n "${SIGNPATH_API_TOKEN}" ] && [ -n "${SIGNPATH_ORGANIZATION_ID}" ] \
             && [ -n "${SIGNPATH_PROJECT_SLUG}" ] && [ -n "${SIGNPATH_SIGNING_POLICY_SLUG}" ]; then
            echo "SIGN_WINDOWS=true" >> "$GITHUB_ENV"
          elif [ "${SIGNING_REQUIRED}" = "true" ]; then
            echo "::error::SIGNING_REQUIRED=true, mas os segredos/variáveis do SignPath não estão configurados."
            exit 1
          else
            echo "::warning::Assinatura SignPath não configurada: o helper e o instalador do Windows sairão NÃO assinados."
          fi

      # O helper é assinado ANTES de ser embutido no instalador (o Inno copia o .exe já assinado);
      # depois o instalador inteiro é assinado de novo, mais abaixo.
      - name: Enviar o helper de atualização para assinatura (SignPath)
        if: env.SIGN_WINDOWS == 'true'
        id: upload-helper-unsigned
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-helper-unsigned
          path: target/release/auto_update_helper.exe
          retention-days: 1

      - name: Assinar o helper de atualização (SignPath)
        if: env.SIGN_WINDOWS == 'true'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-helper-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-helper

      - name: Substituir o helper pelo assinado (antes do Inno embuti-lo)
        if: env.SIGN_WINDOWS == 'true'
        shell: bash
        run: |
          test -f signed-helper/auto_update_helper.exe
          cp -f signed-helper/auto_update_helper.exe target/release/auto_update_helper.exe

      - name: Compilar Instalador Oficial com Wizard (Inno Setup)
        shell: bash
        run: |
          choco install innosetup --no-progress -y
          mkdir -p dist
          VERSION="$(cargo pkgid -p app | cut -d# -f2 | cut -d: -f2 2>/dev/null || sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          # Compila o assistente de instalação profissional com o ISCC
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" //DAppVersion="${VERSION}" scripts/windows/installer.iss

      - name: Enviar o instalador para assinatura (SignPath)
        if: env.SIGN_WINDOWS == 'true'
        id: upload-unsigned
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-installer-unsigned
          path: dist/db-modeling-windows-setup.exe
          retention-days: 1

      # Falha do SignPath (rejeição, timeout, política) derruba o job: nada sem assinatura é publicado
      # quando a assinatura está configurada.
      - name: Assinar o instalador (SignPath)
        if: env.SIGN_WINDOWS == 'true'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Substituir pelo instalador assinado e criar aliases
        shell: bash
        run: |
          if [ "${SIGN_WINDOWS:-}" = "true" ]; then
            test -f signed/db-modeling-windows-setup.exe
            cp -f signed/db-modeling-windows-setup.exe dist/db-modeling-windows-setup.exe
          fi
          # Aliases versionado e canônico (usado pelo site) a partir do instalador final
          cp dist/db-modeling-windows-setup.exe "dist/db-modeling-v${VERSION}-windows-setup.exe"
          cp dist/db-modeling-windows-setup.exe "dist/db-modeling-windows-x86_64.exe"

      - name: Upload dos artefatos Windows
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: artifacts-windows
          path: dist/*
          retention-days: 1

  # ============================================================
  # 3. BUILD MACOS (.dmg e .pkg Apple Silicon) + codesign/notarização
  # ============================================================
  build-macos:
    name: Build macOS (.dmg e .pkg)
    needs: web-bundle
    runs-on: macos-latest
    # `signed=true` só quando o build saiu assinado/notarizado; o `publish` usa isso para só
    # gravar `team_id` no manifesto de auto-update nesse caso.
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    env:
      MACOS_APP_CERT_P12: ${{ secrets.MACOS_APP_CERT_P12 }}
      MACOS_INSTALLER_CERT_P12: ${{ secrets.MACOS_INSTALLER_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_CODESIGN_IDENTITY: ${{ vars.MACOS_CODESIGN_IDENTITY }}
      MACOS_INSTALLER_IDENTITY: ${{ vars.MACOS_INSTALLER_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      SIGNING_REQUIRED: ${{ vars.SIGNING_REQUIRED }}

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Usar o bundle web reconstruído a partir da tag
        shell: bash
        run: find crates/cli/web -mindepth 1 -delete

      - name: Baixar o bundle web
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-bundle
          path: crates/cli/web

      - name: Instalar Toolchain Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-apple-darwin

      - name: Cache de compilação
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: "release-macos"
          save-if: false

      # Importa os certificados Developer ID num keychain temporário (nunca no log).
      # Sem segredos: segue sem assinar, a menos que SIGNING_REQUIRED=true.
      - name: Preparar assinatura (keychain temporário)
        id: signing
        shell: bash
        run: |
          if [ -n "${MACOS_APP_CERT_P12}" ] && [ -n "${MACOS_INSTALLER_CERT_P12}" ] \
             && [ -n "${MACOS_CERT_PASSWORD}" ] && [ -n "${MACOS_CODESIGN_IDENTITY}" ] \
             && [ -n "${MACOS_INSTALLER_IDENTITY}" ] && [ -n "${APPLE_ID}" ] \
             && [ -n "${APPLE_TEAM_ID}" ] && [ -n "${APPLE_APP_PASSWORD}" ]; then
            keychain="${RUNNER_TEMP}/release.keychain-db"
            keychain_password="$(uuidgen)"
            security create-keychain -p "${keychain_password}" "${keychain}"
            security set-keychain-settings -lut 3600 "${keychain}"
            security unlock-keychain -p "${keychain_password}" "${keychain}"
            echo "${MACOS_APP_CERT_P12}" | base64 --decode > "${RUNNER_TEMP}/app.p12"
            echo "${MACOS_INSTALLER_CERT_P12}" | base64 --decode > "${RUNNER_TEMP}/installer.p12"
            security import "${RUNNER_TEMP}/app.p12" -k "${keychain}" -P "${MACOS_CERT_PASSWORD}" -T /usr/bin/codesign
            security import "${RUNNER_TEMP}/installer.p12" -k "${keychain}" -P "${MACOS_CERT_PASSWORD}" -T /usr/bin/productsign -T /usr/bin/pkgbuild
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${keychain_password}" "${keychain}"
            security list-keychains -d user -s "${keychain}" login.keychain-db
            rm -f "${RUNNER_TEMP}/app.p12" "${RUNNER_TEMP}/installer.p12"
            echo "MACOS_SIGNING_REQUIRED=1" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          elif [ "${SIGNING_REQUIRED}" = "true" ]; then
            echo "::error::SIGNING_REQUIRED=true, mas os certificados/credenciais de notarização da Apple não estão configurados."
            exit 1
          else
            echo "::warning::Assinatura/notarização macOS não configurada: os artefatos sairão NÃO assinados."
            # Sem identidades, o script de build apenas avisa.
            echo "MACOS_CODESIGN_IDENTITY=" >> "$GITHUB_ENV"
            echo "MACOS_INSTALLER_IDENTITY=" >> "$GITHUB_ENV"
          fi

      - name: Gerar instaladores .pkg e .dmg
        run: ./scripts/build-macos.sh arm64

      - name: Criar aliases com nomes canônicos
        run: |
          cd dist
          cp $(ls db-modeling-*-arm64.dmg | head -n 1) db-modeling-macos-arm64.dmg
          cp $(ls db-modeling-*-arm64.pkg | head -n 1) db-modeling-macos-setup.pkg

      - name: Upload dos artefatos macOS
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: artifacts-macos
          path: |
            dist/*.pkg
            dist/*.dmg
          retention-days: 1

  # ============================================================
  # 4. PUBLICAÇÃO OFICIAL NO GITHUB RELEASES
  # ============================================================
  publish:
    name: Publicar Release Oficial
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    # Único job com permissão de escrita.
    permissions:
      contents: write

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Criar pasta consolidada de distribuição
        run: mkdir -p release-dist

      - name: Baixar artefatos Linux
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: artifacts-linux
          path: release-dist

      - name: Baixar artefatos Windows
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: artifacts-windows
          path: release-dist

      - name: Baixar artefatos macOS
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: artifacts-macos
          path: release-dist

      # O install.sh baixa este arquivo da mesma tag e confere o SHA-256 antes de instalar.
      - name: Gerar somas de verificação SHA-256
        run: |
          cd release-dist
          sha256sum * > SHA256SUMS.txt
          echo "=== Checksums gerados ==="
          cat SHA256SUMS.txt

      # Valores externos entram por `env:` (nunca interpolados no script) e a tag é validada.
      - name: Determinar Tag
        id: tag_info
        env:
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="${INPUT_TAG:-$REF_NAME}"
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-+.][0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag inválida: '$tag' (esperado vMAJOR.MINOR.PATCH)."
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          # Canal único `stable`: só vMAJOR.MINOR.PATCH puro ganha manifesto de auto-update e vira
          # `latest`. Tags com sufixo (-rc.1, +build) saem como pré-release, sem manifesto.
          if printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Tag '${tag}' é pré-release: sem latest.json e fora do 'latest'."
          fi

      # --- Manifesto de auto-update (só tags estáveis) -------------------------------------------
      # rsign2 fixado em versão exata (RSIGN2_VERSION) e instalado com `cargo install --locked`:
      # o crates.io é imutável por versão e o --locked usa o Cargo.lock publicado da crate. O
      # binário fica em cache (mesma chave = mesma versão); o `--version` abaixo confere o que
      # foi restaurado. O cache fica fora de `rust-cache` para não depender da chave do build.
      - name: Cache do rsign2
        id: rsign_cache
        if: steps.tag_info.outputs.stable == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/rsign
          key: rsign2-${{ runner.os }}-${{ env.RSIGN2_VERSION }}

      - name: Instalar rsign2 (versão exata)
        if: steps.tag_info.outputs.stable == 'true' && steps.rsign_cache.outputs.cache-hit != 'true'
        # Fora do checkout: o rust-toolchain.toml do repositório não puxa o toolchain do projeto.
        working-directory: ${{ runner.temp }}
        run: cargo install --locked --version "${RSIGN2_VERSION}" rsign2

      - name: Conferir a versão do rsign2
        if: steps.tag_info.outputs.stable == 'true'
        run: |
          actual="$(rsign --version)"
          if [ "${actual}" != "rsign2 ${RSIGN2_VERSION}" ]; then
            echo "::error::rsign inesperado: '${actual}' (esperado 'rsign2 ${RSIGN2_VERSION}')."
            exit 1
          fi

      # Falha se faltar ativo, se tag/Cargo.toml divergirem ou se a tag tiver sufixo.
      # `team_id` só entra quando o build do macOS saiu assinado.
      - name: Gerar o manifesto de atualização (latest.json)
        if: steps.tag_info.outputs.stable == 'true'
        env:
          RELEASE_TAG: ${{ steps.tag_info.outputs.tag }}
          RELEASE_DIST_DIR: release-dist
          MANIFEST_OUTPUT: release-manifest/latest.json
          MACOS_TEAM_ID: ${{ needs.build-macos.outputs.signed == 'true' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          ./scripts/generate-update-manifest.sh
          # Mostra o manifesto sem `team_id` (vem de segredo e o log o mascararia de qualquer forma).
          jq 'del(.platforms[].team_id)' release-manifest/latest.json

      # minisign PREHASHED (`rsign sign` padrão, sem -l). Falha se UPDATER_SIGNING_KEY faltar ou se
      # a assinatura não validar com a chave pública primária embutida no cliente.
      - name: Assinar o manifesto (minisign)
        if: steps.tag_info.outputs.stable == 'true'
        env:
          UPDATER_SIGNING_KEY: ${{ secrets.UPDATER_SIGNING_KEY }}
        run: ./scripts/sign-update-manifest.sh release-manifest/latest.json

      # --- Publicação atômica: rascunho -> verificação -> publicar (último passo) -----------------
      # `latest/download/latest.json` só passa a existir quando a Release deixa de ser rascunho,
      # e isso só acontece depois de todos os ativos estarem lá e verificados.
      - name: Criar Release como RASCUNHO no GitHub
        id: release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          files: |
            release-dist/*
            release-manifest/latest.json
            release-manifest/latest.json.sig
          fail_on_unmatched_files: ${{ steps.tag_info.outputs.stable == 'true' }}
          generate_release_notes: true
          draft: true
          prerelease: ${{ steps.tag_info.outputs.stable != 'true' }}

      # Baixa do RASCUNHO (por ID: /releases/tags/<tag> não enxerga rascunhos) exatamente o que
      # os usuários baixariam e confere assinatura (chave pública primária), URLs e SHA-256.
      - name: Verificar o rascunho (assinatura, URLs e SHA-256)
        if: steps.tag_info.outputs.stable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: |
          set -euo pipefail
          check_dir="${RUNNER_TEMP}/draft-check"
          mkdir -p "${check_dir}"
          assets="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --jq '.[] | [.id, .name] | @tsv')"
          fetch() {
            local id
            id="$(awk -F'\t' -v n="$1" '$2 == n { print $1; exit }' <<< "${assets}")"
            if [ -z "${id}" ]; then
              echo "::error::Ativo '$1' ausente no rascunho."
              exit 1
            fi
            gh api -H "Accept: application/octet-stream" "repos/${GITHUB_REPOSITORY}/releases/assets/${id}" > "${check_dir}/$1"
          }
          fetch latest.json
          fetch latest.json.sig
          fetch SHA256SUMS.txt
          for name in $(jq -r '.platforms[].url | split("/") | last' "${check_dir}/latest.json"); do
            fetch "${name}"
          done
          ./scripts/verify-update-manifest.sh "${check_dir}"

      # ÚLTIMO passo: o rascunho vira público e (só se estável) passa a ser o `latest`.
      - name: Publicar a Release (último passo)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
          STABLE: ${{ steps.tag_info.outputs.stable }}
        run: |
          set -euo pipefail
          make_latest=false
          if [ "${STABLE}" = "true" ]; then
            make_latest=true
          fi
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false -f make_latest="${make_latest}"
