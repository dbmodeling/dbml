[package]
name = "db-introspect"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Read-only database introspection (catalog to DBML). Network and driver code lives here, never in the pure core."

[dependencies]
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "postgres", "mysql"] }
tokio.workspace = true
tiberius = { version = "=0.13.0", default-features = false, features = ["tds73", "rustls"] }
tokio-util = { version = "0.7", features = ["compat"] }
url = "2"
percent-encoding = "2"

[dev-dependencies]
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
dbml-analysis.workspace = true
schema.workspace = true

[lints]
workspace = true
