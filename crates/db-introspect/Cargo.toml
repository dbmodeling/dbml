[package]
name = "db-introspect"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Read-only database introspection (catalog to DBML). Network and driver code lives here, never in the pure core."

[features]
# `drivers` liga os drivers de rede/arquivo (sqlx, tiberius, rusqlite). Sem ele o crate fica puro
# (URL, parâmetros, TLS, DBML) e compila para `wasm32-unknown-unknown`.
default = ["drivers"]
drivers = ["dep:sqlx", "dep:tokio", "dep:tiberius", "dep:tokio-util", "dep:rusqlite"]

[dependencies]
sql-import.workspace = true
dbml-analysis.workspace = true
# Bundled SQLite via libsqlite3-sys >= 0.39 (RUSTSEC-2026-0459). Do not use sqlx-sqlite: it caps
# libsqlite3-sys below 0.38.
rusqlite = { optional = true, version = "=0.43.0", features = ["bundled"] }
sqlx = { version = "=0.9.1", optional = true, default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "mysql"] }
tokio = { workspace = true, optional = true }
tiberius = { optional = true, version = "=0.13.0", default-features = false, features = ["tds73", "rustls"] }
tokio-util = { optional = true, version = "0.7", features = ["compat"] }
url = "2"
percent-encoding = "2"
thiserror.workspace = true

[dev-dependencies]
sqlx = { version = "=0.9.1", default-features = false, features = ["runtime-tokio", "postgres", "mysql"] }
schema.workspace = true

[lints]
workspace = true
