[package]
name = "app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gpui-kit.workspace = true
schema.workspace = true
layout.workspace = true
atomic-write.workspace = true
diagram-export.workspace = true
base64 = "0.22"
dbml-analysis.workspace = true
# Embeds icons in debug builds too (otherwise rust-embed reads from disk using the
# Linux path, which does not exist in cross-built Windows .exe binaries).
rust-embed = { workspace = true, features = ["debug-embed"] }
dbml-edit.workspace = true
sql-import.workspace = true
db-introspect.workspace = true
updater.workspace = true
updater-net.workspace = true
tokio = { workspace = true, features = ["rt", "time", "net", "io-util", "sync"] }
lsp-types.workspace = true
dbml-syntax.workspace = true
anyhow.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true

[features]
# Habilita as variáveis DBM_SIZE/DBM_MODE/DBM_SELECT/DBM_PANE... em release (harness de screenshot).
harness = []

[target.'cfg(windows)'.dependencies]
# Detecção da instalação pendente, chamada do helper e argumentos (lógica pura, ticket 05).
auto-update-helper.workspace = true

[build-dependencies]
embed-resource.workspace = true

[dev-dependencies]
auto-update-helper.workspace = true
tempfile.workspace = true

[lints]
workspace = true
